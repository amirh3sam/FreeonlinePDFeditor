<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{--bg:#0a0e14;--panel:#111722;--panel2:#161e2b;--line:#222c3b;--text:#e6edf3;--mute:#8b98a9;--teal:#3fe0c5;--purple:#a98bff;--danger:#ff6b81}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{border-color:#34445a}
button:disabled{opacity:.4;cursor:default}
button.primary{background:linear-gradient(135deg,var(--teal),var(--purple));color:#0a0e14;border:none;font-weight:600}
button.on{border-color:var(--teal);color:var(--teal);background:rgba(63,224,197,.08)}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{font-weight:700;letter-spacing:.2px;margin-right:6px;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--teal),var(--purple));display:inline-block}
.grow{flex:1}
#fname{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
#tools{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0;flex:none}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--teal)}
input[type=color]{width:28px;height:28px;border:none;background:none;padding:0;flex:none}
input[type=range]{accent-color:var(--teal);width:90px;flex:none}
#sizeLbl{color:var(--mute);min-width:44px;font-variant-numeric:tabular-nums}
main{flex:1;display:flex;min-height:0;position:relative}
#side{width:150px;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px;flex:none}
.th{position:relative;border:2px solid transparent;border-radius:8px;padding:4px;background:var(--panel2);cursor:pointer}
.th.cur{border-color:var(--teal)}
.th .im{background:#fff;border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.th img{width:100%;display:block}
.th .bar{display:flex;justify-content:space-between;align-items:center;margin-top:4px;color:var(--mute);font-size:12px}
.th .bar span{display:flex;gap:2px}
.th .bar button{padding:2px 5px;font-size:12px;border-radius:5px}
#side .add{justify-content:center;font-size:13px}
#viewer{flex:1;overflow:auto;padding:24px 16px 80px;display:flex;flex-direction:column;align-items:center;gap:18px;background:radial-gradient(circle at 50% 0,#121a26,var(--bg) 60%)}
.page{position:relative;background:#fff;box-shadow:0 6px 30px rgba(0,0,0,.45);flex:none}
.page canvas{position:absolute;inset:0;width:100%;height:100%}
.page svg{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-x pan-y}
.page.draw svg{touch-action:none;cursor:crosshair}
.page.texting svg{cursor:text}
.page .num{position:absolute;bottom:-18px;left:0;right:0;text-align:center;color:var(--mute);font-size:11px}
svg [data-id]{touch-action:none}
.selbox{fill:none;stroke:var(--purple);stroke-dasharray:4 3;pointer-events:none}
.handle{fill:#fff;stroke:var(--purple);cursor:nwse-resize;touch-action:none}
textarea.ed{position:absolute;background:rgba(169,139,255,.08);border:1px dashed var(--purple);outline:none;resize:none;overflow:hidden;padding:0;margin:0;font-family:Helvetica,Arial,sans-serif;line-height:1.2;white-space:pre;z-index:5}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.drop{max-width:460px;width:100%;text-align:center;border:2px dashed #2b3748;border-radius:18px;padding:40px 24px;background:rgba(17,23,34,.7)}
.drop.over{border-color:var(--teal)}
.drop h1{font-size:22px;margin:0 0 6px}
.drop p{color:var(--mute);margin:0 0 20px;line-height:1.5}
.drop .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#hint{position:fixed;left:50%;top:120px;transform:translateX(-50%);background:var(--purple);color:#0a0e14;font-weight:600;padding:8px 14px;border-radius:999px;z-index:40;display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal.show{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(560px,100%)}
.card h3{margin:0 0 12px}
#sigPad{width:100%;height:200px;background:#fff;border-radius:10px;touch-action:none;display:block}
.card .row{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.hide{display:none!important}
#pagesBtn{display:none}
@media (max-width:760px){
  #side{position:absolute;left:0;top:0;bottom:0;z-index:20;transform:translateX(-100%);transition:.2s;box-shadow:8px 0 30px rgba(0,0,0,.5)}
  #side.open{transform:none}
  #pagesBtn{display:inline-flex}
  #fname,.wide{display:none}
  header{gap:5px;padding:8px}
  header button{padding:7px 9px}
  #zOut,#zIn{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><i></i><span class="wide">PDF Studio</span></div>
    <button id="pagesBtn">☰ Pages</button>
    <span id="fname"></span>
    <div class="grow"></div>
    <button id="undoBtn" title="Undo (Ctrl+Z)">↶</button>
    <button id="redoBtn" title="Redo (Ctrl+Y)">↷</button>
    <button id="zOut">−</button><span id="zLbl" class="wide" style="min-width:44px;text-align:center;color:var(--mute)">100%</span><button id="zIn">+</button>
    <button id="openBtn">Open<span class="wide">&nbsp;PDF</span></button>
    <button id="saveBtn" class="primary">⬇ Save PDF</button>
  </header>
  <div id="tools">
    <button data-tool="select" class="on">↖ Select</button>
    <button data-tool="text">T Text</button>
    <button data-tool="pen">✎ Draw</button>
    <button data-tool="highlight">▮ Highlight</button>
    <button data-tool="whiteout">▢ Whiteout</button>
    <button data-tool="rect">□ Box</button>
    <button data-tool="erase">⌫ Eraser</button>
    <button id="imgBtn">🖼 Image</button>
    <button id="signBtn">✍ Sign</button>
    <div class="sep"></div>
    <div id="swatches" style="display:flex;gap:6px;align-items:center"></div>
    <input type="color" id="colorPick" value="#111111" title="Custom color">
    <div class="sep"></div>
    <input type="range" id="size" min="1" max="72" value="16">
    <span id="sizeLbl">16pt</span>
    <div class="sep"></div>
    <button id="editTxt" class="hide">Edit text</button>
    <button id="delBtn" class="hide" style="color:var(--danger)">Delete</button>
  </div>
  <main>
    <aside id="side"></aside>
    <div id="viewer"></div>
    <div id="empty">
      <div class="drop" id="drop">
        <h1>Edit any PDF</h1>
        <p>Add text, sign, highlight, draw, white-out, insert images, and rotate, reorder, delete or merge pages. Everything stays in your browser.</p>
        <div class="row">
          <button class="primary" id="openBig">Open a PDF</button>
          <button id="blankBig">Start blank</button>
        </div>
        <p style="margin:16px 0 0;font-size:12px">or drop a PDF here</p>
      </div>
    </div>
  </main>
</div>
<div id="hint"></div>
<div id="toast"></div>
<div class="modal" id="sigModal">
  <div class="card">
    <h3>Draw your signature</h3>
    <canvas id="sigPad"></canvas>
    <div class="row">
      <button class="sw on" data-sc="#111111" style="background:#111"></button>
      <button class="sw" data-sc="#1d4ed8" style="background:#1d4ed8"></button>
      <div class="grow"></div>
      <button id="sigClear">Clear</button>
      <button id="sigCancel">Cancel</button>
      <button id="sigUse" class="primary">Place signature</button>
    </div>
  </div>
</div>
<input type="file" id="fileIn" accept="application/pdf,.pdf" class="hide">
<input type="file" id="mergeIn" accept="application/pdf,.pdf" multiple class="hide">
<input type="file" id="imgIn" accept="image/*" class="hide">

<script>
const pdfjsLib = window.pdfjsLib || window['pdfjs-dist/build/pdf'];
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const HL = '#ffe14d';
let uidN = 1; const uid = () => 'a' + (uidN++);

const S = {
  docs: [], pages: [], zoom: 1, tool: 'select', color: '#111111',
  fontSize: 16, stroke: 3, sel: null, editing: null, pending: null,
  undo: [], redo: [], name: 'document', cur: null
};

/* ---------- helpers ---------- */
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), ms); }
function hint(msg) { const h = $('#hint'); h.textContent = msg || ''; h.style.display = msg ? 'block' : 'none'; }
const pageById = id => S.pages.find(p => p.id === id);
const pageProxies = new Map();
async function proxy(doc, index) { const k = doc + ':' + index; if (!pageProxies.has(k)) pageProxies.set(k, S.docs[doc].pdf.getPage(index + 1)); return pageProxies.get(k); }
async function totalRot(p) { if (p.doc < 0) return 0; const pp = await proxy(p.doc, p.index); return (pp.rotate + p.rot) % 360; }
const mctx = document.createElement('canvas').getContext('2d');
function textW(a) { mctx.font = `${a.size}px Helvetica, Arial, sans-serif`; return Math.max(a.size * .5, ...a.text.split('\n').map(l => mctx.measureText(l).width)); }
function bbox(a) {
  if (a.type === 'path') { let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9; for (const [x, y] of a.pts) { x1 = Math.min(x1, x); y1 = Math.min(y1, y); x2 = Math.max(x2, x); y2 = Math.max(y2, y); } const r = a.width / 2; return { x: x1 - r, y: y1 - r, w: x2 - x1 + 2 * r, h: y2 - y1 + 2 * r }; }
  if (a.type === 'text') return { x: a.x, y: a.y, w: textW(a), h: a.text.split('\n').length * a.size * 1.2 };
  return { x: a.x, y: a.y, w: a.w, h: a.h };
}
function hexRgb(h) { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) / 255); }

/* ---------- undo ---------- */
const snap = () => JSON.stringify(S.pages);
function pushUndo(s) { S.undo.push(s || snap()); if (S.undo.length > 60) S.undo.shift(); S.redo = []; updBtns(); }
function restore(from, to) { if (!from.length) return; to.push(snap()); const prev = S.pages.map(p => p.id + p.rot).join(); S.pages = JSON.parse(from.pop()); S.sel = null; closeEditor(false); const now = S.pages.map(p => p.id + p.rot).join(); if (prev !== now) rebuild(); else S.pages.forEach(drawAnnots); updBtns(); updProps(); }
function updBtns() { $('#undoBtn').disabled = !S.undo.length; $('#redoBtn').disabled = !S.redo.length; $('#saveBtn').disabled = !S.pages.length; }

/* ---------- loading ---------- */
async function loadPdf(file) {
  const buf = await file.arrayBuffer();
  const bytes = buf.slice(0);
  let pdf;
  try { pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise; }
  catch (e) { toast(e.name === 'PasswordException' ? 'That PDF is password-protected.' : "Couldn't open that file as a PDF."); return null; }
  const di = S.docs.push({ bytes, pdf }) - 1;
  const out = [];
  for (let i = 0; i < pdf.numPages; i++) {
    const pp = await proxy(di, i); const vp = pp.getViewport({ scale: 1 });
    out.push({ id: uid(), doc: di, index: i, rot: 0, W: vp.width, H: vp.height, annots: [] });
  }
  return out;
}
async function openFile(file) {
  if (!file) return;
  toast('Opening…', 1500);
  const pages = await loadPdf(file); if (!pages) return;
  S.pages = pages; S.undo = []; S.redo = []; S.sel = null;
  S.name = file.name.replace(/\.pdf$/i, '') || 'document';
  $('#fname').textContent = file.name;
  fitZoom(); rebuild(); updBtns();
}
async function mergeFiles(files) {
  const snapBefore = snap(); let added = 0;
  for (const f of files) { const pg = await loadPdf(f); if (pg) { S.pages.push(...pg); added += pg.length; } }
  if (added) { S.undo.push(snapBefore); S.redo = []; if (!$('#fname').textContent) { S.name = files[0].name.replace(/\.pdf$/i, ''); $('#fname').textContent = files[0].name; fitZoom(); } rebuild(); updBtns(); toast(`Added ${added} page${added > 1 ? 's' : ''}`); }
}
function blankPage() { return { id: uid(), doc: -1, index: 0, rot: 0, W: 612, H: 792, annots: [] }; }
function fitZoom() { const maxW = Math.max(...S.pages.map(p => p.W), 300); const avail = $('#viewer').clientWidth - 40; S.zoom = Math.max(.3, Math.min(1.5, avail / maxW)); }

/* ---------- viewer ---------- */
let io, renderTasks = new Map();
function rebuild() {
  closeEditor(true);
  $('#empty').classList.toggle('hide', S.pages.length > 0);
  const v = $('#viewer'); v.innerHTML = '';
  io && io.disconnect();
  io = new IntersectionObserver(ents => ents.forEach(e => { if (e.isIntersecting) renderCanvas(e.target); if (e.isIntersecting && e.intersectionRatio > .3) setCur(e.target.dataset.id); }), { root: v, rootMargin: '600px 0px', threshold: [0, .3] });
  S.pages.forEach((p, i) => {
    const w = document.createElement('div'); w.className = 'page'; w.dataset.id = p.id;
    const c = document.createElement('canvas');
    const svg = document.createElementNS(NS, 'svg');
    const n = document.createElement('div'); n.className = 'num'; n.textContent = `${i + 1} / ${S.pages.length}`;
    w.append(c, svg, n); v.append(w);
    bindSvg(svg, p.id);
    sizePage(w, p); drawAnnots(p); io.observe(w);
  });
  setToolClass(); buildThumbs(); updBtns();
}
function sizePage(w, p) { w.style.width = p.W * S.zoom + 'px'; w.style.height = p.H * S.zoom + 'px'; w.querySelector('svg').setAttribute('viewBox', `0 0 ${p.W} ${p.H}`); w.dataset.rz = ''; }
function setZoom(z) {
  S.zoom = Math.max(.25, Math.min(4, z)); $('#zLbl').textContent = Math.round(S.zoom * 100) + '%';
  closeEditor(true);
  document.querySelectorAll('.page').forEach(w => { const p = pageById(w.dataset.id); if (p) { sizePage(w, p); drawAnnots(p); } });
  io && io.takeRecords(); document.querySelectorAll('.page').forEach(w => { io.unobserve(w); io.observe(w); });
}
async function renderCanvas(w) {
  const p = pageById(w.dataset.id); if (!p) return;
  const key = S.zoom + ':' + p.rot; if (w.dataset.rz === key) return; w.dataset.rz = key;
  $('#zLbl').textContent = Math.round(S.zoom * 100) + '%';
  const c = w.querySelector('canvas'); const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const sc = S.zoom * dpr;
  if (p.doc < 0) { c.width = 2; c.height = 2; return; }
  const pp = await proxy(p.doc, p.index);
  const vp = pp.getViewport({ scale: sc, rotation: (pp.rotate + p.rot) % 360 });
  const off = document.createElement('canvas'); off.width = Math.floor(vp.width); off.height = Math.floor(vp.height);
  const prev = renderTasks.get(w); if (prev) try { prev.cancel(); } catch (e) { }
  const task = pp.render({ canvasContext: off.getContext('2d'), viewport: vp }); renderTasks.set(w, task);
  try { await task.promise; c.width = off.width; c.height = off.height; c.getContext('2d').drawImage(off, 0, 0); } catch (e) { }
}
function setCur(id) { if (S.cur === id) return; S.cur = id; document.querySelectorAll('.th').forEach(t => t.classList.toggle('cur', t.dataset.id === id)); }

/* ---------- annotations render ---------- */
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.append(e); return e; }
function drawAnnots(p) {
  const w = document.querySelector(`.page[data-id="${p.id}"]`); if (!w) return;
  const svg = w.querySelector('svg'); svg.innerHTML = '';
  for (const a of p.annots) {
    if (S.editing && S.editing.a === a.id) continue;
    const g = el('g', { 'data-id': a.id }, svg);
    if (a.type === 'path') {
      const d = a.pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('') + (a.pts.length === 1 ? 'l0.01 0' : '');
      el('path', { d, fill: 'none', stroke: 'transparent', 'stroke-width': Math.max(a.width, 10 / S.zoom), 'stroke-linecap': 'round' }, g);
      el('path', { d, fill: 'none', stroke: a.color, 'stroke-width': a.width, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: a.opacity || 1 }, g);
    } else if (a.type === 'highlight') {
      el('rect', { x: a.x, y: a.y, width: a.w, height: a.h, fill: a.color, 'fill-opacity': .4, style: 'mix-blend-mode:multiply' }, g);
    } else if (a.type === 'whiteout') {
      el('rect', { x: a.x, y: a.y, width: a.w, height: a.h, fill: '#fff' }, g);
    } else if (a.type === 'rect') {
      el('rect', { x: a.x, y: a.y, width: a.w, height: a.h, fill: 'transparent', stroke: a.color, 'stroke-width': a.width }, g);
    } else if (a.type === 'text') {
      const b = bbox(a); el('rect', { x: b.x, y: b.y, width: b.w, height: b.h, fill: 'transparent' }, g);
      const t = el('text', { fill: a.color, 'font-size': a.size, 'font-family': 'Helvetica, Arial, sans-serif', style: 'white-space:pre' }, g);
      a.text.split('\n').forEach((l, i) => { const s = el('tspan', { x: a.x, y: a.y + a.size * .9 + i * a.size * 1.2 }, t); s.textContent = l || ' '; });
    } else if (a.type === 'image') {
      el('image', { href: a.src, x: a.x, y: a.y, width: a.w, height: a.h, preserveAspectRatio: 'none' }, g);
    }
  }
  if (S.sel && S.sel.p === p.id) {
    const a = p.annots.find(x => x.id === S.sel.a);
    if (a && !(S.editing && S.editing.a === a.id)) {
      const b = bbox(a), pad = 3 / S.zoom;
      el('rect', { class: 'selbox', x: b.x - pad, y: b.y - pad, width: b.w + 2 * pad, height: b.h + 2 * pad, 'stroke-width': 1.5 / S.zoom }, svg);
      el('circle', { class: 'handle', 'data-handle': 1, cx: b.x + b.w + pad, cy: b.y + b.h + pad, r: 7 / S.zoom, 'stroke-width': 2 / S.zoom }, svg);
    }
  }
}

/* ---------- interaction ---------- */
let drag = null;
function pt(e, svg, p) { const r = svg.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * p.W, (e.clientY - r.top) / r.height * p.H]; }
function select(pid, aid) { const old = S.sel && S.sel.p; S.sel = aid ? { p: pid, a: aid } : null; if (old && old !== pid) drawAnnots(pageById(old)); if (pid) drawAnnots(pageById(pid)); updProps(); }
function selAnnot() { if (!S.sel) return null; const p = pageById(S.sel.p); return p && p.annots.find(a => a.id === S.sel.a); }

function bindSvg(svg, pid) {
  svg.addEventListener('pointerdown', e => {
    const p = pageById(pid); if (!p || e.button > 0) return;
    if (S.editing) { closeEditor(true); if (S.tool === 'text') return; }
    const q = pt(e, svg, p);
    const g = e.target.closest('[data-id]'); const a = g && p.annots.find(x => x.id === g.dataset.id);
    if (S.pending) { placePending(p, q); e.preventDefault(); return; }
    const t = S.tool;
    if (t === 'select') {
      if (e.target.closest('[data-handle]') && selAnnot()) { const sa = selAnnot(); drag = { kind: 'resize', p, a: sa, start: q, orig: JSON.parse(JSON.stringify(sa)), bb: bbox(sa), snap: snap(), moved: false }; }
      else if (a) { select(pid, a.id); drag = { kind: 'move', p, a, start: q, orig: JSON.parse(JSON.stringify(a)), snap: snap(), moved: false }; }
      else { select(null); return; }
    } else if (t === 'erase') {
      if (a) { pushUndo(); p.annots = p.annots.filter(x => x !== a); drawAnnots(p); }
      drag = { kind: 'erase', p };
    } else if (t === 'text') {
      e.preventDefault();
      if (a && a.type === 'text') { openEditor(p, a, true); return; }
      pushUndo();
      const na = { id: uid(), type: 'text', x: q[0], y: q[1] - S.fontSize * .6, text: '', size: S.fontSize, color: S.color };
      p.annots.push(na); openEditor(p, na, false); return;

    if (!dlNs) { toast('Downloads aren’t available in this view — open the page directly on claude.ai.', 4000); return; }
    await dlNs.save({ filename: fname, data: new Blob([bytes], { type: 'application/pdf' }) });
    toast('Saved ✓');
  } catch (e) {
    if (e && e.code === 'declined') toast('Save cancelled');
    else if (e && e.code === 'rate_limited') toast('A save prompt is already open');
    else { console.error(e); toast('Couldn’t build the PDF: ' + (e.message || e.code || e)); }
  } finally { btn.disabled = false; btn.textContent = '⬇ Save PDF'; }
}

/* ---------- wiring ---------- */
$('#openBtn').onclick = $('#openBig').onclick = () => $('#fileIn').click();
$('#fileIn').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; openFile(f); });
$('#mergeIn').addEventListener('change', e => { const f = [...e.target.files]; e.target.value = ''; mergeFiles(f); });
$('#blankBig').onclick = () => { S.pages = [blankPage()]; S.name = 'untitled'; $('#fname').textContent = 'untitled.pdf'; fitZoom(); rebuild(); };
$('#saveBtn').onclick = savePdf;
$('#undoBtn').onclick = () => restore(S.undo, S.redo);
$('#redoBtn').onclick = () => restore(S.redo, S.undo);
$('#zIn').onclick = () => setZoom(S.zoom * 1.2);
$('#zOut').onclick = () => setZoom(S.zoom / 1.2);
$('#pagesBtn').onclick = () => $('#side').classList.toggle('open');
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? restore(S.redo, S.undo) : restore(S.undo, S.redo); }
  else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); restore(S.redo, S.undo); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { if (selAnnot()) { e.preventDefault(); delSel(); } }
  else if (e.key === 'Escape') { if (S.pending) { S.pending = null; hint(''); setToolClass(); } select(null); }
  else if (!mod) { const m = { v: 'select', t: 'text', d: 'pen', h: 'highlight', w: 'whiteout', b: 'rect', e: 'erase' }[e.key.toLowerCase()]; if (m && S.pages.length) setTool(m); }
});
['dragover', 'dragenter'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); $('#drop').classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); $('#drop').classList.remove('over'); }));
document.addEventListener('drop', e => { const fs = [...(e.dataTransfer?.files || [])].filter(f => /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name)); if (!fs.length) return; if (S.pages.length) mergeFiles(fs); else openFile(fs[0]).then(() => fs.length > 1 && mergeFiles(fs.slice(1))); });
setColor('#111111'); updProps(); updBtns();
</script>
</body>
</html>
